name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-system-production
  cancel-in-progress: false

jobs:
  pages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/docs/out
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  external-smoke:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the independent public route
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          curl --fail --silent --show-error --max-time 20 \
            --dump-header "$headers" --output "$body" \
            https://design.whitekiwi.link/
          grep -Fq 'PIP' "$body"
          grep -Eiq '^content-type: text/html' "$headers"
          asset_path="$(grep -oE 'src="/_next/static/[^"]+\.js"' "$body" | sed -n '1s/^src="//;1s/"$//;1p')"
          test -n "$asset_path"
          curl --fail --silent --show-error --max-time 20 \
            --output /dev/null "https://design.whitekiwi.link${asset_path}"
