name: PIP 개선
description: 실제 사용에서 발견한 문제, 빠진 기능이나 설계 기준을 제안합니다.
body:
  - type: markdown
    attributes:
      value: |
        하나의 실제 사용 사례로도 개선을 시작할 수 있습니다.
        기존 issue와 PR을 먼저 확인해 주세요. 변경과 검증 방법이 명확하면 PR로 바로 기여해도 됩니다.
  - type: textarea
    id: use-case
    attributes:
      label: 사용 사례와 현재 문제
      description: 어떤 화면이나 작업에서 무엇이 불편했나요? 재현 단계나 작은 코드 예제를 함께 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 어떤 동작이나 설명이 있으면 문제가 해결되나요? 실제 결과와 기대한 결과를 구분해 주세요.
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: 개선 방향과 열린 질문
      description: 검토한 기존 API·조합, 공유할 부분, 제품에 남길 부분을 적어 주세요. 해결안을 아직 몰라도 괜찮습니다.
  - type: textarea
    id: context
    attributes:
      label: 버전과 관련 근거
      description: PIP 버전 또는 commit, 소비 제품, 관련 issue/PR, 임시 우회 방법과 제거 조건을 아는 범위에서 적어 주세요. 문서 제안은 관련 경로를 적어 주세요.
